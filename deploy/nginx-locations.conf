# ── Vermarkter location blocks ────────────────────────────────────────────────
# Add these inside the `server { listen 443 ssl; ... }` block for my-salon.eu.
# Both services listen on 127.0.0.1 only — do NOT open ports 8082/8083 in ufw.
#
# After editing nginx config:
#   nginx -t && systemctl reload nginx
# ─────────────────────────────────────────────────────────────────────────────

    # Brevo transactional email webhook
    # Production URL: https://my-salon.eu/brevo/webhook?token=SECRET
    location /brevo/webhook {
        proxy_pass            http://127.0.0.1:8082;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout    30s;
        proxy_connect_timeout 10s;
        client_max_body_size  64k;
    }

    # Street View image proxy (hides Google API key from email recipients)
    # Usage in email: <img src="https://my-salon.eu/proxy-image?lead_id=123">
    location /proxy-image {
        proxy_pass            http://127.0.0.1:8083;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout    30s;
        proxy_connect_timeout 10s;
    }
